name: AET Hunter offline development tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no private data files or scheduled live scans are tracked
        run: python public_guard.py
      - name: Compile deployment wrappers without running live scanners
        run: python -m py_compile ops/modal/hunter_modal.py ops/modal/legacy_bridge.py ops/github/public_actions_runner.py
      - name: Run offline code tests with sockets disabled
        run: python run_offline_tests.py
