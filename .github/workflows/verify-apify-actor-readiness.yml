name: Verify Apify Actor and account headroom (GET only)
on:
  workflow_dispatch:
  # One-time owner-authorized read-only check, removed after this push.
  push:
    branches: [main]
    paths: ['.github/workflows/verify-apify-actor-readiness.yml']

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'ali00978/aet-hunter-public' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actor details and monthly account limit (read-only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python ops/github/apify_actor_readiness.py
