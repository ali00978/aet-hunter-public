name: AET Hunter original scanners (separate platforms)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Choose ONE platform to test or operate'
        required: true
        type: choice
        options:
          - marktplaats
          - facebook
  schedule:
    # Marktplaats up to every two hours (12 times daily).
    - cron: '17 */2 * * *'
    # Facebook at most twice daily (<=62 monthly starts before provider cap).
    - cron: '47 2,14 * * *'

permissions:
  contents: read

# Prevent concurrent clones from racing to update private combined results.
concurrency:
  group: aet-public-original-hunter
  cancel-in-progress: false

jobs:
  marktplaats:
    if: ${{ github.repository == 'ali00978/aet-hunter-public' && vars.AET_PUBLIC_HUNTER_ENABLED == 'true' && vars.AET_GITHUB_TERMS_APPROVED == 'true' && (github.event.schedule == '17 */2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'marktplaats')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run only original private Marktplaats scanner
        env:
          AET_HUNTER_PLATFORM: marktplaats
          AET_PUBLIC_HUNTER_ENABLED: ${{ vars.AET_PUBLIC_HUNTER_ENABLED }}
          AET_GITHUB_TERMS_APPROVED: ${{ vars.AET_GITHUB_TERMS_APPROVED }}
          AET_GITHUB_TOKEN: ${{ secrets.AET_GITHUB_TOKEN }}
          AET_PRO_SYNC_URL: ${{ secrets.AET_PRO_SYNC_URL }}
          AET_HUNTER_SYNC_TOKEN: ${{ secrets.AET_HUNTER_SYNC_TOKEN }}
        run: python ops/github/public_actions_runner.py

  facebook:
    if: ${{ github.repository == 'ali00978/aet-hunter-public' && vars.AET_PUBLIC_HUNTER_ENABLED == 'true' && vars.AET_GITHUB_TERMS_APPROVED == 'true' && (github.event.schedule == '47 2,14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'facebook')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run only original private Apify Facebook scanner
        env:
          AET_HUNTER_PLATFORM: facebook
          AET_PUBLIC_HUNTER_ENABLED: ${{ vars.AET_PUBLIC_HUNTER_ENABLED }}
          AET_GITHUB_TERMS_APPROVED: ${{ vars.AET_GITHUB_TERMS_APPROVED }}
          AET_GITHUB_TOKEN: ${{ secrets.AET_GITHUB_TOKEN }}
          AET_PRO_SYNC_URL: ${{ secrets.AET_PRO_SYNC_URL }}
          AET_HUNTER_SYNC_TOKEN: ${{ secrets.AET_HUNTER_SYNC_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python ops/github/public_actions_runner.py
