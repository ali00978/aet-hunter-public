name: AET Hunter PUBLIC standalone scanners (GitHub Plan A)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-original-hunter.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Run ONE source'
        required: true
        type: choice
        options: [marktplaats, facebook]
      bootstrap_state:
        description: 'Only for FIRST Marktplaats run if encrypted state does not exist'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
    - cron: '47 2,14 * * *'

permissions:
  contents: read

concurrency:
  group: aet-public-original-hunter
  cancel-in-progress: false

jobs:
  marktplaats:
    if: >-
      ${{ github.repository == 'ali00978/aet-hunter-public' && github.ref == 'refs/heads/main' && vars.AET_PUBLIC_HUNTER_ENABLED != 'false' && (github.event_name == 'push' || inputs.platform == 'marktplaats' || github.event.schedule == '17 */2 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated encryption library
        run: python -m pip install 'cryptography>=45,<50'
      - uses: actions/cache/restore@v4
        with:
          path: .aet-secure-state/state.enc
          key: aet-hunter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aet-hunter-state-v1-
      - name: Scan PUBLIC Marktplaats and synchronize AET Pro privately
        id: scan
        env:
          AET_PUBLIC_HUNTER_ENABLED: ${{ vars.AET_PUBLIC_HUNTER_ENABLED }}
          AET_STATE_BOOTSTRAP: ${{ (github.event_name == 'push' || inputs.bootstrap_state) && 'true' || 'false' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AET_HUNTER_PLATFORM: marktplaats
          AET_PRO_SYNC_URL: ${{ secrets.AET_PRO_SYNC_URL }}
          AET_HUNTER_SYNC_TOKEN: ${{ secrets.AET_HUNTER_SYNC_TOKEN }}
        run: python -m ops.github.standalone_hunter_runner
      - name: Save encrypted Hunter history EVEN if scan fails
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .aet-secure-state/state.enc
          key: aet-hunter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
  facebook:
    if: >-
      ${{ github.repository == 'ali00978/aet-hunter-public' && github.ref == 'refs/heads/main' && vars.AET_PUBLIC_HUNTER_ENABLED != 'false' && vars.AET_FACEBOOK_ENABLED == 'true' && (github.event.schedule == '47 2,14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'facebook')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated encryption library
        run: python -m pip install 'cryptography>=45,<50'
      - uses: actions/cache/restore@v4
        with:
          path: .aet-secure-state/state.enc
          key: aet-hunter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aet-hunter-state-v1-
      - name: Run capped Apify Facebook collector and synchronize AET Pro
        id: scan
        env:
          AET_PUBLIC_HUNTER_ENABLED: ${{ vars.AET_PUBLIC_HUNTER_ENABLED }}
          AET_FACEBOOK_ENABLED: ${{ vars.AET_FACEBOOK_ENABLED }}
          AET_APIFY_MONTHLY_BUDGET_USD: ${{ vars.AET_APIFY_MONTHLY_BUDGET_USD }}
          AET_APIFY_MAX_CHARGE_USD: ${{ vars.AET_APIFY_MAX_CHARGE_USD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AET_HUNTER_PLATFORM: facebook
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AET_PRO_SYNC_URL: ${{ secrets.AET_PRO_SYNC_URL }}
          AET_HUNTER_SYNC_TOKEN: ${{ secrets.AET_HUNTER_SYNC_TOKEN }}
        run: python -m ops.github.standalone_hunter_runner
      - name: Save encrypted Facebook budget and candidates EVEN on failure
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .aet-secure-state/state.enc
          key: aet-hunter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
