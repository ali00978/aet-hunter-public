name: Verify GitHub and Apify tokens (read only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'ali00978/aet-hunter-public' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only private GitHub read access and Apify authentication
        env:
          AET_GITHUB_TOKEN: ${{ secrets.AET_GITHUB_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python ops/github/readonly_connection_check.py
